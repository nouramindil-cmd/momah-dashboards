<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة استطلاعات وزارة البلديات والإسكان</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#152029; --muted:#63727f; --line:#e3e9ef;
    --brand:#0b5c4a; --brand-soft:#e6f3ef;
    --open:#0a7a52; --open-soft:#e4f5ee;
    --soon:#a8620a; --soon-soft:#fdf0dd;
    --done:#5a6b78; --done-soft:#eef2f5;
    --new:#c0264a; --new-soft:#fdeaef;
    --shadow:0 1px 2px rgba(16,32,45,.06), 0 6px 16px rgba(16,32,45,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#11171c; --card:#181f26; --ink:#e7edf2; --muted:#93a3b1; --line:#26313a;
      --brand:#4dc4a4; --brand-soft:#12302a;
      --open:#4dc4a4; --open-soft:#123029;
      --soon:#e6a851; --soon-soft:#33260f;
      --done:#93a3b1; --done-soft:#212a32;
      --new:#ff7a9c; --new-soft:#3a1622;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,Arial,sans-serif;
    font-size:15px; line-height:1.6; padding:24px 20px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto}

  header h1{font-size:22px;margin:0 0 4px;font-weight:700;letter-spacing:-.2px}
  header .sub{color:var(--muted);font-size:13px;margin:0 0 20px}

  /* ---- new-items alert ---- */
  #alert{
    display:none; background:var(--new-soft); border:1px solid var(--new);
    border-right:5px solid var(--new); border-radius:12px;
    padding:14px 18px; margin-bottom:20px; box-shadow:var(--shadow);
  }
  #alert.on{display:block; animation:pop .45s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  #alert h2{margin:0 0 6px;font-size:16px;color:var(--new)}
  #alert ul{margin:8px 0 0;padding-inline-start:20px}
  #alert li{margin:3px 0}
  #alert .dismiss{
    float:left;background:none;border:1px solid var(--new);color:var(--new);
    border-radius:8px;padding:3px 12px;cursor:pointer;font-family:inherit;font-size:13px
  }

  /* ---- stats ---- */
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 18px;min-width:120px;box-shadow:var(--shadow)
  }
  .stat b{display:block;font-size:24px;line-height:1.2;font-weight:700}
  .stat span{font-size:12px;color:var(--muted)}
  .stat.a b{color:var(--open)} .stat.b b{color:var(--soon)} .stat.c b{color:var(--brand)}

  /* ---- controls ---- */
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  input[type=search],select{
    font-family:inherit;font-size:14px;padding:10px 14px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--ink);box-shadow:var(--shadow)
  }
  input[type=search]{flex:1;min-width:240px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    font-family:inherit;font-size:13px;padding:8px 14px;border-radius:99px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--muted);box-shadow:var(--shadow)
  }
  .chip.sel{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

  /* ---- list ---- */
  #count{color:var(--muted);font-size:13px;margin:0 0 10px}
  .row{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 18px;margin-bottom:10px;box-shadow:var(--shadow);
    display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
    border-right:4px solid var(--done)
  }
  .row.open{border-right-color:var(--open)}
  .row.soon{border-right-color:var(--soon)}
  .row.isnew{border-right-color:var(--new);background:var(--new-soft)}
  .ttl{font-weight:600;margin:0 0 5px;font-size:15px}
  .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .meta .sep{opacity:.4}
  .tag{padding:2px 10px;border-radius:99px;font-size:12px;white-space:nowrap;font-weight:600}
  .tag.open{background:var(--open-soft);color:var(--open)}
  .tag.soon{background:var(--soon-soft);color:var(--soon)}
  .tag.done{background:var(--done-soft);color:var(--done)}
  .tag.new{background:var(--new);color:#fff}
  .purpose{font-size:13px;color:var(--muted);margin:7px 0 0;display:none}
  .row.expand .purpose{display:block}
  .acts{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
  .btn{
    font-size:12.5px;text-decoration:none;padding:7px 13px;border-radius:9px;white-space:nowrap;
    border:1px solid var(--line);color:var(--ink);background:var(--bg);display:inline-block
  }
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.pri:hover{opacity:.88;color:#fff}
  .btn.off{opacity:.35;pointer-events:none}
  .more{background:none;border:none;color:var(--brand);cursor:pointer;font-family:inherit;font-size:12.5px;padding:0}

  footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
  footer code{background:var(--card);border:1px solid var(--line);padding:2px 7px;border-radius:6px;font-size:12px}
  @media(max-width:720px){ .row{grid-template-columns:1fr} .acts{justify-content:flex-start} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>استطلاعات وزارة البلديات والإسكان</h1>
  <p class="sub" id="sub"></p>
</header>

<div id="alert">
  <button class="dismiss" onclick="dismiss()">إخفاء</button>
  <h2 id="alertHead"></h2>
  <div id="alertBody"></div>
</div>

<div class="stats" id="stats"></div>

<div class="controls">
  <input type="search" id="q" placeholder="ابحث في الاسم أو الهدف أو النوع…" autocomplete="off">
  <div class="chips" id="filters"></div>
  <select id="sort">
    <option value="new">الأحدث أولاً</option>
    <option value="old">الأقدم أولاً</option>
    <option value="az">أبجدي</option>
  </select>
</div>

<p id="count"></p>
<div id="list"></div>

<footer>
  <p><strong>التنبيه:</strong> مهمة ويندوز <code>Istitlaa-MOMRAH-Watch</code> تفحص المنصة كل 4 ساعات، تنزّل الجديد تلقائياً، وتحدّث هذه الصفحة. لما تفتحين الصفحة بعد نزول جديد يطلع لك الشريط الأحمر فوق.</p>
  <p>للفحص الفوري: شغّلي <code>تحديث الآن.cmd</code> داخل مجلد الاستطلاعات على سطح المكتب.</p>
  <p id="loc"></p>
</footer>

</div>

/* days remaining is computed live, every time the page opens, from the end date --
   never baked in at generation time, or the countdown would freeze between refreshes */
function daysLeft(end){
  var p = String(end||'').split('/');
  if (p.length !== 3) return null;
  var d = new Date(+p[2], +p[1]-1, +p[0]);
  if (isNaN(d)) return null;
  var t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}
function dleft(it){ var d = daysLeft(it.end); return d === null ? it.days : d; }
function isOpen(it){ return it.status === 'open' && dleft(it) >= 0; }

/* DATA.base is "" for the copy that sits inside the archive folder (relative links),
   and an absolute file:/// URL for copies kept anywhere else (e.g. Downloads). */
function enc(p){ return (DATA.base || '') + p.split('/').map(encodeURIComponent).join('/'); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ---- what changed since the last time this page was opened ---- */
function detectNew(){
  var prev = null;
  try { prev = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  var freshP = [], freshR = [];
  if (prev && prev.ids) {
    var ids = {}, res = {};
    prev.ids.forEach(function(i){ ids[i]=1; });
    (prev.res||[]).forEach(function(i){ res[i]=1; });
    DATA.items.forEach(function(it){
      if (!ids[it.id]) { freshP.push(it); state.newIds[it.id]=1; }
      else if (it.results && !res[it.id]) { freshR.push(it); state.newRes[it.id]=1; }
    });
  }
  try {
    localStorage.setItem(KEY, JSON.stringify({
      ids: DATA.items.map(function(i){ return i.id; }),
      res: DATA.items.filter(function(i){ return i.results; }).map(function(i){ return i.id; }),
      at:  Date.now()
    }));
  } catch(e){}
  return { p:freshP, r:freshR };
}

function showAlert(fresh){
  var n = fresh.p.length, m = fresh.r.length;
  if (!n && !m) return;
  var head = [];
  if (n) head.push(n === 1 ? 'استطلاع جديد' : n + ' استطلاعات جديدة');
  if (m) head.push(m === 1 ? 'تقرير نتائج جديد' : m + ' تقارير نتائج جديدة');
  document.getElementById('alertHead').textContent = '🔔 ' + head.join('  +  ');
  var html = '<ul>';
  fresh.p.forEach(function(i){ html += '<li><strong>' + esc(i.title) + '</strong> — ينتهي ' + esc(i.end) + '</li>'; });
  fresh.r.forEach(function(i){ html += '<li>تقرير نتائج: ' + esc(i.title) + '</li>'; });
  html += '</ul>';
  document.getElementById('alertBody').innerHTML = html;
  document.getElementById('alert').className = 'on';
  document.title = '(' + (n + m) + ') ' + document.title;
  if (window.Notification && Notification.permission === 'granted') {
    try { new Notification(head.join(' + '), { body: fresh.p.concat(fresh.r).slice(0,3).map(function(i){return '• '+i.title;}).join('\n') }); } catch(e){}
  }
}
function dismiss(){ document.getElementById('alert').className = ''; }

/* ---- rendering ---- */
function cls(it){
  if (state.newIds[it.id] || state.newRes[it.id]) return 'isnew';
  if (isOpen(it)) return dleft(it) <= 7 ? 'soon' : 'open';
  return '';
}
function tag(it){
  var d = dleft(it);
  if (it.status === 'open'){
    if (d < 0) return '<span class="tag done">انتهت المدة</span>';
    var c = d <= 7 ? 'soon' : 'open';
    var t = d === 0 ? 'ينتهي اليوم' : (d === 1 ? 'باقي يوم واحد' : 'باقي ' + d + ' يوم');
    return '<span class="tag ' + c + '">' + t + '</span>';
  }
  if (it.status === 'coming') return '<span class="tag soon">قادم</span>';
  return '<span class="tag done">منتهي</span>';
}

function render(){
  var q = state.q.trim().toLowerCase();
  var items = DATA.items.filter(function(it){
    if (state.filter === 'open'   && !isOpen(it)) return false;
    if (state.filter === 'new'    && !(state.newIds[it.id] || state.newRes[it.id])) return false;
    if (state.filter === 'nores'  && it.results) return false;
    if (state.filter === 'res'    && !it.results) return false;
    if (!q) return true;
    return (it.title + ' ' + it.type + ' ' + (it.purpose||'')).toLowerCase().indexOf(q) > -1;
  });
  items.sort(function(a,b){
    if (state.sort === 'az') return a.title.localeCompare(b.title,'ar');
    return state.sort === 'old' ? a.sd.localeCompare(b.sd) : b.sd.localeCompare(a.sd);
  });

  document.getElementById('count').textContent = 'يعرض ' + items.length + ' من ' + DATA.items.length;
  document.getElementById('list').innerHTML = items.map(function(it){
    var badge = state.newIds[it.id] ? '<span class="tag new">جديد</span>'
              : state.newRes[it.id] ? '<span class="tag new">نتائج جديدة</span>' : '';
    var dl = !it.docs ? [] : (Array.isArray(it.docs) ? it.docs : [it.docs]);
    var docs = dl.map(function(d){
      return '<a class="btn pri" href="' + enc(d) + '" target="_blank">📄 ملف الاستطلاع</a>'; }).join('');
    if (!docs) docs = '<span class="btn off">لا يوجد ملف</span>';
    var res = it.results
      ? '<a class="btn" href="' + enc(it.results) + '" target="_blank">📋 تقرير النتائج</a>'
      : '<span class="btn off">لا يوجد تقرير</span>';
    return '<div class="row ' + cls(it) + '" id="r' + it.id + '">' +
      '<div>' +
        '<p class="ttl">' + esc(it.title) + '</p>' +
        '<div class="meta">' + badge + tag(it) +
          '<span class="sep">•</span><span>' + esc(it.type) + '</span>' +
          '<span class="sep">•</span><span>' + esc(it.start) + ' ← ' + esc(it.end) + '</span>' +
          (it.purpose ? '<span class="sep">•</span><button class="more" onclick="tog(' + it.id + ')">الهدف</button>' : '') +
        '</div>' +
        (it.purpose ? '<p class="purpose">' + esc(it.purpose) + '</p>' : '') +
      '</div>' +
      '<div class="acts">' + docs + res +
        '<a class="btn" href="' + esc(it.page) + '" target="_blank">🌐 الصفحة</a>' +
      '</div>' +
    '</div>';
  }).join('') || '<p style="color:var(--muted)">لا نتائج مطابقة.</p>';
}
function tog(id){ var e = document.getElementById('r'+id); e.className = e.className.indexOf('expand')>-1 ? e.className.replace(' expand','') : e.className+' expand'; }

/* ---- boot ---- */
(function(){
  var fresh = detectNew();

  var open = DATA.items.filter(isOpen).length;
  var soon = DATA.items.filter(function(i){ return isOpen(i) && dleft(i) <= 7; }).length;
  var res  = DATA.items.filter(function(i){ return i.results; }).length;
  var docs = DATA.items.reduce(function(s,i){
    return s + (!i.docs ? 0 : (Array.isArray(i.docs) ? i.docs.length : 1)); }, 0);

  document.getElementById('sub').innerHTML =
    esc(DATA.agency) + '  •  ' + (docs+res) + ' ملف على جهازك' +
    '  •  آخر فحص للمنصة: ' + esc(DATA.generated) +
    '  •  <span title="يُحسب من تاريخ اليوم في كل مرة تفتحين الصفحة">العد التنازلي محدَّث لحظياً ⏱</span>';

  document.getElementById('stats').innerHTML =
    '<div class="stat c"><b>' + DATA.items.length + '</b><span>استطلاع</span></div>' +
    '<div class="stat a"><b>' + open + '</b><span>مفتوح للمرئيات</span></div>' +
    '<div class="stat b"><b>' + soon + '</b><span>ينتهي خلال أسبوع</span></div>' +
    '<div class="stat"><b>' + docs + '</b><span>ملف استطلاع</span></div>' +
    '<div class="stat"><b>' + res + '</b><span>تقرير نتائج</span></div>';

  var nNew = fresh.p.length + fresh.r.length;
  document.getElementById('filters').innerHTML =
    [['all','الكل'],['open','مفتوح الآن'],['new','الجديد' + (nNew?' ('+nNew+')':'')],
     ['res','له تقرير نتائج'],['nores','بدون تقرير']]
    .map(function(f){ return '<button class="chip' + (f[0]==='all'?' sel':'') + '" data-f="' + f[0] + '">' + f[1] + '</button>'; }).join('');

  document.getElementById('filters').addEventListener('click', function(e){
    if (e.target.dataset.f === undefined) return;
    state.filter = e.target.dataset.f;
    [].forEach.call(this.children, function(c){ c.className = 'chip' + (c === e.target ? ' sel' : ''); });
    render();
  });
  document.getElementById('q').addEventListener('input', function(){ state.q = this.value; render(); });
  document.getElementById('sort').addEventListener('change', function(){ state.sort = this.value; render(); });

  if (DATA.base) {
    document.getElementById('loc').innerHTML =
      'الملفات محفوظة في: <code>' + esc(decodeURIComponent(DATA.base.replace('file:///',''))) + '</code>';
  }

  showAlert(fresh);
  render();
  if (window.Notification && Notification.permission === 'default') {
    setTimeout(function(){ try { Notification.requestPermission(); } catch(e){} }, 1500);
  }
})();
</script>
</body>
</html>
