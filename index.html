<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مركز اللوحات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --rail:#003A37; --rail-2:#0a4a46; --rail-line:rgba(255,255,255,.09);
  --rail-ink:#e8f2f0; --rail-mute:#8fb3ae;
  --lime:#9BC73E;
  --ground:#f3f5f4; --paper:#ffffff; --ink:#10201e; --mute:#5b6b68; --line:#dde4e2; --soft:#e9eeec;
  --c-house:#9BC73E; --c-reg:#009A93; --c-eco:#3f95bd; --c-build:#cf9a3a;
  --focus:#9BC73E;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0c1716; --paper:#122120; --ink:#e4eeec; --mute:#8ea4a0; --line:#213432; --soft:#18292;
    --soft:#182a28; --rail:#06201e; --rail-2:#0c2c29;
  }
}
:root[data-theme="dark"]{
  --ground:#0c1716; --paper:#122120; --ink:#e4eeec; --mute:#8ea4a0; --line:#213432;
  --soft:#182a28; --rail:#06201e; --rail-2:#0c2c29;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--ground);color:var(--ink);font-size:15px;line-height:1.6;
  display:grid;grid-template-columns:292px 1fr;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* ---------- الشريط الجانبي ---------- */
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;min-height:0;
  padding:22px 0 14px;position:relative;z-index:5}
.brand{padding:0 22px 18px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--rail-line)}
.brand img{width:150px;height:auto;opacity:.95}
.brand-name{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand-name b{font-size:19px;font-weight:700;letter-spacing:0}
.brand-name span{font-size:12px;color:var(--rail-mute);font-variant-numeric:tabular-nums}
.search{margin:16px 16px 6px;position:relative}
.search input{width:100%;background:var(--rail-2);border:1px solid var(--rail-line);border-radius:9px;
  padding:9px 38px 9px 52px;color:var(--rail-ink);outline:none}
.search input::placeholder{color:var(--rail-mute)}
.search input:focus{border-color:var(--lime)}
.search svg{position:absolute;right:12px;top:50%;translate:0 -50%;width:16px;height:16px;stroke:var(--rail-mute)}
.search kbd{position:absolute;left:10px;top:50%;translate:0 -50%;font:11px/1 var(--font);color:var(--rail-mute);
  border:1px solid var(--rail-line);border-radius:5px;padding:4px 6px;direction:ltr}
nav{flex:1;overflow-y:auto;padding:6px 10px 10px;scrollbar-width:thin;scrollbar-color:var(--rail-2) transparent}
.home-link{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;margin:6px 0 4px;border:0;border-radius:8px;
  background:none;cursor:pointer;text-align:right;color:var(--rail-ink);font-weight:500}
.home-link svg{width:17px;height:17px;stroke:currentColor}
.group{margin-top:14px}
.group h3{margin:0;padding:0 12px 6px;font-size:11.5px;font-weight:600;color:var(--rail-mute);letter-spacing:.02em;
  display:flex;align-items:center;gap:8px}
.group h3 i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;width:100%;padding:8px 12px;border:0;
  border-radius:8px;background:none;cursor:pointer;text-align:right;color:var(--rail-ink);font-size:14px;position:relative}
.item small{font-size:11px;color:var(--rail-mute);font-variant-numeric:tabular-nums;direction:ltr}
.item:hover,.home-link:hover{background:var(--rail-2)}
.item[aria-current="true"],.home-link[aria-current="true"]{background:var(--rail-2);font-weight:600}
.item[aria-current="true"]::before,.home-link[aria-current="true"]::before{content:"";position:absolute;right:0;top:9px;bottom:9px;width:3px;
  border-radius:3px;background:var(--c,var(--lime))}
.home-link{position:relative}
.item .dot{display:none}
.item.loaded small::after{content:" ●";color:var(--lime)}
.rail-foot{padding:12px 16px 0;border-top:1px solid var(--rail-line);display:flex;gap:8px;align-items:center;justify-content:space-between;
  font-size:12px;color:var(--rail-mute)}
.ghost{background:none;border:1px solid var(--rail-line);color:var(--rail-ink);border-radius:8px;padding:6px 10px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.ghost:hover{background:var(--rail-2)}
.ghost svg{width:15px;height:15px;stroke:currentColor}
.empty-note{padding:14px 12px;color:var(--rail-mute);font-size:13px}

/* ---------- المساحة الرئيسية ---------- */
main{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.topbar{display:none}

/* الرئيسية */
#home{overflow-y:auto;height:100%}
.home-inner{max-width:1180px;margin:0 auto;padding:44px 40px 60px}
.eyebrow{font-size:12.5px;color:var(--mute);font-weight:500;letter-spacing:.02em}
.hero h1{font-size:clamp(30px,4vw,46px);line-height:1.15;margin:6px 0 10px;font-weight:700;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--c-reg)}
.hero p{margin:0;color:var(--mute);max-width:62ch}

.skyline-wrap{margin:34px 0 8px;position:relative}
.skyline{width:100%;height:auto;display:block;overflow:visible}
.skyline .bld{cursor:pointer;transition:opacity .2s}
.skyline .bld rect.body{transition:filter .2s}
.skyline:hover .bld{opacity:.45}
.skyline .bld:hover,.skyline .bld:focus{opacity:1}
.skyline .bld:hover rect.body{filter:brightness(1.08)}
.skyline .win{fill:var(--ground);opacity:.55}
.skyline .ground{stroke:var(--ink);stroke-width:1.5}
.skyline .glabel{fill:var(--mute);font-size:12px;font-weight:600}
.skyline .size{fill:var(--ink);font-size:11px;font-variant-numeric:tabular-nums}
.sky-legend{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--ground);font-size:12.5px;padding:7px 10px;border-radius:7px;
  white-space:nowrap;translate:50% -100%;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}

.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 48px;margin-top:40px}
.sec h2{font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:10px;font-weight:700}
.sec h2 i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.sec h2 span{font-size:12px;color:var(--mute);font-weight:400;margin-inline-start:auto}
.sec ul{list-style:none;margin:10px 0 0;padding:0;border-top:2px solid var(--c)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);
  cursor:pointer;width:100%;background:none;border-inline:0;border-top:0;text-align:right}
.row:hover{background:var(--soft)}
.row b{font-weight:600;font-size:15px}
.row p{margin:0;grid-column:1;color:var(--mute);font-size:13px;line-height:1.5}
.row .meta{grid-row:1 / span 2;grid-column:2;display:flex;align-items:center;gap:12px;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.row .meta svg{width:16px;height:16px;stroke:var(--ink);transition:translate .2s}
.row:hover .meta svg{translate:-4px 0}
.heavy{color:var(--c-build);font-weight:600}
.foot-note{margin-top:40px;font-size:12px;color:var(--mute);display:flex;gap:18px;flex-wrap:wrap}
.foot-note kbd{font:11px var(--font);border:1px solid var(--line);border-radius:4px;padding:1px 5px;direction:ltr;display:inline-block}

/* العارض */
#viewer{display:flex;flex-direction:column;height:100%;min-height:0}
.vbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line);min-height:56px}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.crumb .sec-chip{font-size:12px;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);
  color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.crumb .sec-chip i{width:7px;height:7px;border-radius:2px;background:var(--c)}
.crumb b{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px}
.tbtn{background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.tbtn:hover{background:var(--soft)}
.tbtn svg{width:17px;height:17px;stroke:currentColor}
.stage{flex:1;position:relative;min-height:0;background:var(--paper)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--paper);z-index:2}
.loading .box{text-align:center;display:grid;gap:12px;justify-items:center;color:var(--mute);font-size:13.5px}
.loading .bar{width:220px;height:3px;background:var(--soft);border-radius:3px;overflow:hidden;position:relative}
.loading .bar::after{content:"";position:absolute;inset:0;width:40%;background:var(--c,var(--c-reg));border-radius:3px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{translate:260% 0}to{translate:-110% 0}}
.loading b{color:var(--ink);font-size:16px}

/* لوحة البحث السريع */
.palette{position:fixed;inset:0;background:rgba(3,20,19,.45);display:grid;place-items:start center;padding:12vh 16px 0;z-index:50}
.pal-box{width:min(560px,100%);background:var(--paper);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden;border:1px solid var(--line)}
.pal-box input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:none;outline:none}
.pal-list{max-height:52vh;overflow-y:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:right}
.pal-item i{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
.pal-item span{color:var(--mute);font-size:12px;margin-inline-start:auto}
.pal-item[aria-selected="true"]{background:var(--soft)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* الجوال */
@media (max-width: 860px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--rail);color:var(--rail-ink);
    padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topbar b{font-size:16px}
  .topbar img{height:26px;width:auto}
  .rail{position:fixed;inset:0 auto 0 0;right:0;left:auto;width:min(310px,86vw);translate:100% 0;visibility:hidden;transition:translate .25s,visibility .25s}
  body.menu-open .rail{translate:0 0;visibility:visible;box-shadow:-10px 0 40px rgba(0,0,0,.3)}
  .skyline-wrap{display:none}
  .sections{margin-top:26px}
  .home-inner{padding:26px 16px 40px}
  .sections{grid-template-columns:1fr}
  .vbar{padding:8px 12px}
  .tools .opt{display:none}
}
</style>
</head>

function renderNav(filter=""){
  const f = filter.trim();
  let html = `<button class="home-link" data-go="" type="button"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>الرئيسية</button>`;
  let hits = 0;
  for (const s of SECTIONS){
    const items = TOOLS.filter(t => t.sec === s.id && (!f || (t.name+t.desc+s.name).includes(f)));
    if (!items.length) continue;
    hits += items.length;
    html += `<div class="group" style="--c:${s.color}"><h3><i></i>${s.name}</h3>` +
      items.map(t => `<button class="item" type="button" data-go="${t.id}" style="--c:${s.color}">${esc(t.name)}<small>${fmtMB(t.mb)}</small></button>`).join("") +
      `</div>`;
  }
  if (!hits) html += `<div class="empty-note">لا توجد لوحة مطابقة لـ«${esc(f)}»</div>`;
  $("#nav").innerHTML = html;
  markNav();
}
function markNav(){
  const cur = location.hash.replace(/^#\/?/, "");
  document.querySelectorAll("#nav [data-go]").forEach(b => {
    b.setAttribute("aria-current", b.dataset.go === cur ? "true" : "false");
    b.classList.toggle("loaded", frames.has(b.dataset.go));
  });
}
$("#q").addEventListener("input", e => renderNav(e.target.value));
$("#nav").addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  go(b.dataset.go); document.body.classList.remove("menu-open");
});

/* ---------- الأقسام في الرئيسية ---------- */
const arrow = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>`;
$("#sections").innerHTML = SECTIONS.map(s => {
  const items = TOOLS.filter(t => t.sec === s.id);
  return `<div class="sec" style="--c:${s.color}"><h2><i></i>${s.name}<span>${items.length} ${items.length>2?"لوحات":"لوحتان"}</span></h2><ul>` +
    items.map(t => `<li><button class="row" type="button" data-go="${t.id}"><b>${esc(t.name)}</b><p>${esc(t.desc)}</p>
      <span class="meta"><span class="${t.mb>=HEAVY_MB?"heavy":""}">${fmtMB(t.mb)}</span>${arrow}</span></button></li>`).join("") +
    `</ul></div>`;
}).join("");
$("#sections").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });

/* ---------- أفق المدينة: مبنى لكل لوحة ---------- */
function drawSkyline(){
  const svg = $("#sky");
  const W = Math.max(320, $("#skyWrap").clientWidth), H = W < 600 ? 190 : 240, base = H - 30, top = 22;
  const gapIn = W < 600 ? 5 : 10, gapSec = W < 600 ? 16 : 34;
  const n = TOOLS.length, gaps = (n - SECTIONS.length) * gapIn + (SECTIONS.length - 1) * gapSec;
  const bw = (W - gaps) / n;
  const lmin = Math.log10(0.05), lmax = Math.log10(Math.max(...TOOLS.map(t=>t.mb)));
  const hOf = mb => 18 + (Math.log10(mb) - lmin) / (lmax - lmin) * (base - top - 18);
  let x = W, out = "";                     // من اليمين لليسار
  SECTIONS.forEach((s, si) => {
    const items = TOOLS.filter(t => t.sec === s.id);
    const x0 = x;
    items.forEach((t, i) => {
      const h = hOf(t.mb), bx = x - bw, by = base - h;
      let wins = "";
      const cols = Math.max(1, Math.floor((bw - 8) / 11)), rows = Math.floor((h - 14) / 13);
      const cw = (bw - 8) / cols;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
        if ((r * 7 + c * 3 + i) % 5) wins += `<rect class="win" x="${(bx + 4 + c*cw + cw*.25).toFixed(1)}" y="${(by + 10 + r*13).toFixed(1)}" width="${(cw*.5).toFixed(1)}" height="5"/>`;
      out += `<g class="bld" tabindex="0" role="link" data-go="${t.id}" aria-label="${t.name}، ${fmtMB(t.mb)}">
        <rect class="body" x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${s.color}"/>
        ${wins}
        <text class="size" x="${(bx + bw/2).toFixed(1)}" y="${(by - 6).toFixed(1)}" text-anchor="middle">${fmtMB(t.mb)}</text></g>`;
      x -= bw + (i < items.length - 1 ? gapIn : 0);
    });
    out += `<text class="glabel" x="${((x0 + x) / 2).toFixed(1)}" y="${base + 20}" text-anchor="middle">${s.name}</text>`;
    x -= gapSec;
  });
  out += `<line class="ground" x1="0" x2="${W}" y1="${base}" y2="${base}"/>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = out;
}
const tip = $("#tip");
$("#sky").addEventListener("mousemove", e => {
  const g = e.target.closest(".bld");
  if (!g){ tip.classList.remove("on"); return; }
  const t = TOOLS.find(t => t.id === g.dataset.go), r = $("#skyWrap").getBoundingClientRect();
  tip.textContent = t.name; tip.style.left = (e.clientX - r.left) + "px"; tip.style.top = (e.clientY - r.top - 12) + "px";
  tip.style.translate = "-50% -100%"; tip.classList.add("on");
});
$("#sky").addEventListener("mouseleave", () => tip.classList.remove("on"));
$("#sky").addEventListener("click", e => { const g = e.target.closest(".bld"); if (g) go(g.dataset.go); });
$("#sky").addEventListener("keydown", e => { const g = e.target.closest(".bld"); if (g && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); go(g.dataset.go); } });
new ResizeObserver(() => { if (!$("#home").hidden) drawSkyline(); }).observe($("#skyWrap"));

/* ---------- العارض: إطارات محمّلة مع الاحتفاظ بآخر ٣ ---------- */
const frames = new Map();   // id -> iframe (ترتيب الإدراج = الأقدم أولاً)
let current = null;
function showTool(t){
  const s = secOf(t);
  document.documentElement.style.setProperty("--c", s.color);
  $("#crumb").innerHTML = `<span class="sec-chip" style="--c:${s.color}"><i></i>${s.name}</span><b title="${esc(t.desc)}">${esc(t.name)}</b>`;
  document.title = `${t.name} · مركز اللوحات`;
  let fr = frames.get(t.id);
  if (fr){ frames.delete(t.id); frames.set(t.id, fr); $("#loading").hidden = true; }
  else {
    fr = document.createElement("iframe");
    fr.title = t.name; fr.src = encodeURI(t.file);
    $("#loadName").textContent = t.name;
    $("#loadNote").textContent = t.mb >= HEAVY_MB ? `ملف كبير (${fmtMB(t.mb)})، قد يستغرق التحميل بضع ثوانٍ` : "جارٍ التحميل";
    $("#loading").style.setProperty("--c", s.color);
    $("#loading").hidden = false;
    fr.addEventListener("load", () => { if (current === t.id) $("#loading").hidden = true; });
    $("#stage").appendChild(fr);
    frames.set(t.id, fr);
    while (frames.size > KEEP_ALIVE){ const [oid, of] = frames.entries().next().value; of.remove(); frames.delete(oid); }
  }
  frames.forEach((f, id) => f.hidden = id !== t.id);
  current = t.id;
  $("#loadedInfo").textContent = `${frames.size} ${frames.size === 1 ? "لوحة مفتوحة" : "لوحات مفتوحة"}`;
}
function route(){
  const id = location.hash.replace(/^#\/?/, "");
  const t = TOOLS.find(t => t.id === id);
  $("#home").hidden = !!t; $("#viewer").hidden = !t;
  if (t){ showTool(t); store.set("hub.last", t.id); }
  else { current = null; document.title = "مركز اللوحات"; drawSkyline(); }
  markNav();
}
function go(id){ location.hash = id ? "/" + id : ""; if (!id) history.replaceState(null, "", location.pathname); route(); }
window.addEventListener("hashchange", route);
function step(d){ const i = ordered.findIndex(t => t.id === current); go(ordered[(i + d + ordered.length) % ordered.length].id); }

$("#backBtn").onclick = () => go("");
$("#prevBtn").onclick = () => step(-1);
$("#nextBtn").onclick = () => step(1);
$("#reloadBtn").onclick = () => { const f = frames.get(current); if (f){ $("#loading").hidden = false; f.src = f.src; } };
$("#fullBtn").onclick = () => { const s = $("#stage"); document.fullscreenElement ? document.exitFullscreen() : s.requestFullscreen?.(); };
$("#popBtn").onclick = () => { const t = TOOLS.find(t => t.id === current); if (t) window.open(encodeURI(t.file), "_blank"); };
$("#menuBtn").onclick = () => document.body.classList.toggle("menu-open");

/* ---------- البحث السريع Ctrl+K ---------- */
let palSel = 0, palItems = [];
function openPal(){ $("#palette").hidden = false; $("#palQ").value = ""; renderPal(); $("#palQ").focus(); }
function closePal(){ $("#palette").hidden = true; }
function renderPal(){
  const f = $("#palQ").value.trim();
  palItems = ordered.filter(t => !f || (t.name + t.desc + secOf(t).name).includes(f));
  palSel = Math.min(palSel, Math.max(0, palItems.length - 1));
  $("#palList").innerHTML = palItems.length ? palItems.map((t, i) =>
    `<button class="pal-item" type="button" role="option" aria-selected="${i===palSel}" data-go="${t.id}" style="--c:${secOf(t).color}"><i></i>${esc(t.name)}<span>${secOf(t).name}</span></button>`).join("")
    : `<div class="empty-note" style="color:var(--mute)">لا توجد نتائج</div>`;
}
$("#palQ").addEventListener("input", () => { palSel = 0; renderPal(); });
$("#palQ").addEventListener("keydown", e => {
  if (e.key === "ArrowDown"){ e.preventDefault(); palSel = Math.min(palSel + 1, palItems.length - 1); renderPal(); }
  if (e.key === "ArrowUp"){ e.preventDefault(); palSel = Math.max(palSel - 1, 0); renderPal(); }
  if (e.key === "Enter" && palItems[palSel]){ closePal(); go(palItems[palSel].id); }
});
$("#palList").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b){ closePal(); go(b.dataset.go); } });
$("#palette").addEventListener("click", e => { if (e.target.id === "palette") closePal(); });

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); $("#palette").hidden ? openPal() : closePal(); }
  else if (e.key === "Escape"){ if (!$("#palette").hidden) closePal(); else if (document.body.classList.contains("menu-open")) document.body.classList.remove("menu-open"); else if (current) go(""); }
  else if (e.altKey && current && (e.key === "ArrowLeft" || e.key === "ArrowRight")){ e.preventDefault(); step(e.key === "ArrowLeft" ? 1 : -1); }
});

/* ---------- المظهر ---------- */
const themes = ["system","light","dark"], themeNames = {system:"تلقائي", light:"فاتح", dark:"داكن"};
function applyTheme(m){
  if (m === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = m;
  $("#themeLbl").textContent = themeNames[m];
}
let theme = store.get("hub.theme") || "system"; applyTheme(theme);
$("#themeBtn").onclick = () => { theme = themes[(themes.indexOf(theme) + 1) % 3]; store.set("hub.theme", theme); applyTheme(theme); };

renderNav();
route();
</script>
